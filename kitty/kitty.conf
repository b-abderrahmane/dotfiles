background_opacity 0.8

# tmux (set-clipboard on) copies via OSC 52. Older kitty (<0.22, e.g. the
# 0.21 on Ubuntu) *appends* each OSC 52 write to the existing clipboard
# instead of replacing it, so every yank piles onto the last one.
# no-append restores normal replace semantics; harmless on newer kitty.
clipboard_control write-clipboard write-primary no-append
